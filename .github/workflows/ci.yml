name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: TypeScript & Python Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript Strict Typecheck
        run: pnpm run typecheck

      - name: Electron IPC Boundary Verification
        run: pnpm run test:electron

      - name: Frontend Build
        run: pnpm build

      - name: Python Test Suite & Contract Verification
        run: python3 -m unittest discover -s tests -v
